<section id="passwordScreen" class="screen">

  <div class="welcome-glow"></div>

  <div class="welcome-floating-text">
    <span>WELCOME</span>
    <span>TO</span>
    <span>AHMIE</span>
    <span>SITE</span>
  </div>

  <div class="password-container">

    <p class="eyebrow">
      A PRIVATE LITTLE WORLD
    </p>

    <div class="lock-icon">
      ♡
    </div>

    <h1>
      Welcome to Ahmie Site
    </h1>

    <p class="password-subtitle">
      Enter the secret code to continue.
    </p>

    <!-- LOVE hint -->

    <div class="love-hint">

      <div>
        <strong>2</strong>
        <span>L</span>
      </div>

      <div>
        <strong>6</strong>
        <span>O</span>
      </div>

      <div>
        <strong>2</strong>
        <span>V</span>
      </div>

      <div>
        <strong>8</strong>
        <span>E</span>
      </div>

    </div>

    <!-- Password -->

    <div class="password-input-wrap">

      <input
        id="passwordInput"
        type="password"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
        placeholder="••••"
        aria-label="Password"
      >

      <div class="input-line"></div>

    </div>

    <p id="codeMessage" class="code-message">
      Four digits. That's all. ♡
    </p>

    <button
      id="unlockButton"
      class="gold-button"
      type="button"
    >
      UNLOCK
      <span>→</span>
    </button>

  </div>

</section>
